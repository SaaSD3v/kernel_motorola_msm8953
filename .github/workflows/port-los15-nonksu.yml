name: Import Albus 4.9 DroidSpaces series

on:
  push:
    branches: [ci-port-helper]
    paths: ['.github/workflows/port-los15-nonksu.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-port-helper
          fetch-depth: 1

      - name: Import 4.9 and create adapted DroidSpaces commits
        env:
          SOURCE_REPO: https://github.com/SaaSD3v/kernel_motorola_msm8593_4.9.git
          SOURCE_BRANCH: lineage-19.1
          SOURCE_COMMIT: 9f7458ae94af543b42d9ce03ff66cb2e768acc25
          SOURCE_TREE: d3cf623e27988c14f7fcab4fd5c3324ac467f505
          DROIDSPACES_REF: ravindu644/Droidspaces-OSS@2280b592f43312254dc3c976fc01558aa1186d51
        run: |
          set -euxo pipefail
          git config user.name 'SaaSD3v'
          git config user.email 'hearesaas@gmail.com'
          git remote add k49 "$SOURCE_REPO"
          git fetch --depth=1 --no-tags k49 "$SOURCE_BRANCH"
          test "$(git rev-parse k49/$SOURCE_BRANCH)" = "$SOURCE_COMMIT"
          test "$(git rev-parse k49/$SOURCE_BRANCH^{tree})" = "$SOURCE_TREE"

          # Clean root import: do not mix the former Linux 3.18 lineage with 4.9.
          git checkout --orphan albus-4.9-droidspaces "k49/$SOURCE_BRANCH"
          git read-tree --reset -u "k49/$SOURCE_BRANCH"
          git commit -m 'albus: import Linux 4.9.227 baseline' \
            -m 'Exact Albus tree imported from SaaSD3v/kernel_motorola_msm8593_4.9 lineage-19.1.' \
            -m "Source-Commit: $SOURCE_COMMIT" -m "Source-Tree: $SOURCE_TREE"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          grep -qx 'VERSION = 4' Makefile
          grep -qx 'PATCHLEVEL = 9' Makefile
          grep -qx 'SUBLEVEL = 227' Makefile
          grep -q 'static struct file_system_type cgroup2_fs_type;' kernel/cgroup.c
          grep -q 'struct cgroup_namespace init_cgroup_ns' kernel/cgroup.c
          test ! -d drivers/kernelsu

          DEFCONFIG=arch/arm64/configs/albus_defconfig
          grep -RhE '^[[:space:]]*(menu)?config[[:space:]]+[A-Za-z0-9_]+' --include='Kconfig*' . \
            | sed -E 's/^[[:space:]]*(menu)?config[[:space:]]+([A-Za-z0-9_]+).*/\2/' \
            | sort -u > /tmp/kconfig-symbols
          set_y() {
            if grep -qx "$1" /tmp/kconfig-symbols; then scripts/config --file "$DEFCONFIG" -e "$1"; else echo "SKIP CONFIG_$1"; fi
          }
          set_n() {
            if grep -qx "$1" /tmp/kconfig-symbols; then scripts/config --file "$DEFCONFIG" -d "$1"; else echo "SKIP CONFIG_$1"; fi
          }
          cfg_commit() {
            git add "$DEFCONFIG"
            if ! git diff --cached --quiet; then
              git commit -m "$1" \
                -m 'Adapted for the Albus Linux 4.9 Kconfig; unsupported newer-kernel symbols are not added.' \
                -m "DroidSpaces-Reference: $DROIDSPACES_REF"
            fi
          }

          for s in SYSCTL SYSVIPC POSIX_MQUEUE NAMESPACES PID_NS UTS_NS IPC_NS USER_NS SECCOMP SECCOMP_FILTER; do set_y "$s"; done
          cfg_commit 'droidspaces: enable IPC namespaces and seccomp'

          # Linux 4.9 already has the cgroup2 filesystem and cgroup namespace in core.
          # Enable the resource controllers actually implemented by this tree.
          for s in CGROUPS CGROUP_DEVICE CGROUP_PIDS CGROUP_SCHED FAIR_GROUP_SCHED CFS_BANDWIDTH CGROUP_FREEZER CGROUP_CPUACCT CGROUP_NET_PRIO CPUSETS PROC_PID_CPUSET MEMCG MEMCG_SWAP MEMCG_KMEM CGROUP_MEM_RES_CTLR CGROUP_MEM_RES_CTLR_SWAP CGROUP_MEM_RES_CTLR_KMEM BLK_CGROUP CGROUP_WRITEBACK CGROUP_HUGETLB CGROUP_PERF; do set_y "$s"; done
          cfg_commit 'droidspaces: enable 4.9 cgroup v1/v2 resource controllers'

          for s in DEVTMPFS OVERLAY_FS TMPFS_POSIX_ACL TMPFS_XATTR FW_LOADER FW_LOADER_USER_HELPER FW_LOADER_COMPRESS TUN BLK_DEV_LOOP UNIX98_PTYS DEVPTS_MULTIPLE_INSTANCES; do set_y "$s"; done
          cfg_commit 'droidspaces: enable container device and filesystem primitives'

          for s in NET_NS VETH BRIDGE NETFILTER BRIDGE_NETFILTER NETFILTER_ADVANCED NETFILTER_XTABLES NF_CONNTRACK IP_NF_IPTABLES IP_NF_FILTER NF_NAT NF_TABLES IP_NF_TARGET_MASQUERADE NETFILTER_XT_TARGET_MASQUERADE NETFILTER_XT_TARGET_TCPMSS NETFILTER_XT_MATCH_ADDRTYPE NF_CONNTRACK_NETLINK NF_NAT_REDIRECT IP_ADVANCED_ROUTER IP_MULTIPLE_TABLES NF_CONNTRACK_IPV4 NF_NAT_IPV4 IP_NF_NAT NETFILTER_XT_TARGET_CHECKSUM VLAN_8021Q; do set_y "$s"; done
          cfg_commit 'droidspaces: enable namespace networking and NAT support'

          for s in NETFILTER_XT_MATCH_COMMENT NETFILTER_XT_MATCH_STATE NETFILTER_XT_MATCH_CONNTRACK NETFILTER_XT_MATCH_MULTIPORT NETFILTER_XT_MATCH_HL NETFILTER_XT_TARGET_REJECT IP_NF_TARGET_REJECT NETFILTER_XT_TARGET_LOG IP_NF_TARGET_ULOG NETFILTER_XT_MATCH_RECENT NETFILTER_XT_MATCH_LIMIT NETFILTER_XT_MATCH_HASHLIMIT NETFILTER_XT_MATCH_OWNER NETFILTER_XT_MATCH_PKTTYPE NETFILTER_XT_MATCH_MARK NETFILTER_XT_TARGET_MARK IP_SET IP_SET_HASH_IP IP_SET_HASH_NET NETFILTER_XT_SET NETFILTER_NETLINK_QUEUE NETFILTER_NETLINK_LOG NETFILTER_XT_TARGET_NFLOG; do set_y "$s"; done
          cfg_commit 'droidspaces: enable optional UFW and Fail2ban firewall support'

          set_n ANDROID_PARANOID_NETWORK
          cfg_commit 'droidspaces: disable legacy Android paranoid networking when present'

          # Adapt official non-GKI patch 02 to 4.9's pre-split kernel/cgroup.c.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/cgroup.c')
          s = p.read_text()
          marker = '''\tif (cft->file_offset) {
          \t\tstruct cgroup_file *cfile = (void *)css + cft->file_offset;
          
          \t\tspin_lock_irq(&cgroup_file_kn_lock);
          \t\tcfile->kn = kn;
          \t\tspin_unlock_irq(&cgroup_file_kn_lock);
          \t}
          
          \treturn 0;
          }
          '''
          replacement = '''\tif (cft->file_offset) {
          \t\tstruct cgroup_file *cfile = (void *)css + cft->file_offset;
          
          \t\tspin_lock_irq(&cgroup_file_kn_lock);
          \t\tcfile->kn = kn;
          \t\tspin_unlock_irq(&cgroup_file_kn_lock);
          \t}
          
          \t/* DroidSpaces/LXC compatibility: keep prefixed aliases for noprefix. */
          \tif (cft->ss && (cgrp->root->flags & CGRP_ROOT_NOPREFIX) &&
          \t    !(cft->flags & CFTYPE_NO_PREFIX)) {
          \t\tsnprintf(name, CGROUP_FILE_NAME_MAX, "%s.%s",
          \t\t\t cft->ss->name, cft->name);
          \t\tkernfs_create_link(cgrp->kn, name, kn);
          \t}
          
          \treturn 0;
          }
          '''
          if 'DroidSpaces/LXC compatibility: keep prefixed aliases' not in s:
              if marker not in s: raise SystemExit('unexpected 4.9 cgroup_add_file layout')
              p.write_text(s.replace(marker, replacement, 1))
          PY
          git add kernel/cgroup.c
          if ! git diff --cached --quiet; then
            git commit --author='ravindu644 <droidcasts@protonmail.com>' \
              -m 'Droidspaces/LXC: fix: restore cgroup file prefix handling' \
              -m 'Adapt official non-GKI patch 02 to Linux 4.9 kernel/cgroup.c.' \
              -m 'Original-Patch: ravindu644/Droidspaces-OSS@50cb2ccbef7d84852f2600bb4d3e69f6bd736561' \
              -m 'Signed-off-by: ravindu644 <droidcasts@protonmail.com>'
          fi

          # Official qtaguid patch 01 is intentionally omitted: this 4.9 tree has no xt_qtaguid.
          test ! -e net/netfilter/xt_qtaguid.c
          test ! -d drivers/kernelsu
          ! grep -q '^CONFIG_KSU' "$DEFCONFIG"
          grep -q 'DroidSpaces/LXC compatibility: keep prefixed aliases' kernel/cgroup.c
          grep -q 'static struct file_system_type cgroup2_fs_type;' kernel/cgroup.c
          grep -q 'struct cgroup_namespace init_cgroup_ns' kernel/cgroup.c
          git --no-pager log --oneline -12
          git push --force origin HEAD:lineage-15.1
